<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hermes Pixel Office</title>
<style>
  html,body{margin:0;height:100%;background:#1a1423;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;height:100%;position:relative}
  body.fs #hdr{position:absolute;top:0;left:0;right:0;z-index:2;opacity:0;background:#1a1423;transition:opacity .2s}
  body.fs #hdr:hover{opacity:1}
  #hdr{color:#e8c170;padding:7px 14px;font-size:13px;letter-spacing:1px;
    border-bottom:2px solid #3a2f4b;display:flex;justify-content:space-between;
    align-items:center;gap:8px;flex-wrap:wrap}
  #hdr .dim{color:#7a6f8f}
  #hdr .btn{cursor:pointer;color:#cfc4e8;border:1px solid #3a2f4b;
    border-radius:3px;padding:2px 8px;font-size:12px;background:#241c30;
    user-select:none}
  #hdr .btn:hover{border-color:#e8c170;color:#e8c170}
  #hdr .btn.on{color:#5fce7a;border-color:#5fce7a}
  #editbar{display:none;gap:6px;align-items:center}
  canvas{flex:1;image-rendering:pixelated;width:100%;height:100%;cursor:grab}
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span>&#9764; HERMES PIXEL OFFICE</span>
    <span style="flex:1"></span>
    <span class="dim" id="count">connecting…</span>
    <span id="editbar">
      <span class="btn" id="addplant">+ plant</span>
      <span class="btn" id="addtv">+ TV set</span>
      <span class="btn" id="addshelf">+ shelf</span>
      <span class="btn" id="del">remove</span>
      <span class="btn" id="reset">reset</span>
      <span class="btn" id="cancel">cancel</span>
      <span class="btn on" id="save">save</span>
    </span>
    <span class="btn" id="zout" title="zoom out (Ctrl + wheel)">&minus;</span>
    <span class="btn" id="zin" title="zoom in (Ctrl + wheel)">+</span>
    <span class="btn" id="fit" title="fit the whole office">fit</span>
    <span class="btn" id="full" title="fullscreen: office fills the whole screen (Esc to exit, move the mouse to the top for buttons)">full</span>
    <span class="btn" id="edit" title="move desks, TV set, plants; add or remove furniture">&#9998; layout</span>
    <span class="btn" id="sound" title="chime when an agent needs approval or a subagent finishes">&#9834; sound off</span>
    <span class="btn" id="spawn" style="display:none" title="open a terminal running hermes">+ agent</span>
  </div>
  <canvas id="c"></canvas>
</div>
<script>
"use strict";
// ── host detection ──────────────────────────────────────────────────────
const IN_VSCODE = typeof acquireVsCodeApi !== "undefined";
const vsapi = IN_VSCODE ? acquireVsCodeApi() : null;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let S = 4;                                  // pixels per grid cell (= camera zoom)
let agents = [], frame = 0, offline = null;
const cam = {x:0,y:0,z:4}; let userCam=false;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const X=x=>(x-cam.x)*S, Y=y=>(y-cam.y)*S;

// ── palettes / sprites ──────────────────────────────────────────────────
const SKIN=["#f0c8a0","#c68b59","#8d5524","#ffdbac","#e0ac69","#a1665e"];
const SHIRT=["#4fa4d8","#d84f6f","#5fce7a","#c9a227","#9b6fd8","#d87f4f"];
const HAIR=["#2b2b2b","#5a3825","#c9a227","#8a8a8a","#7a3030","#4a6741"];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function px(x,y,w,h,col){
  ctx.fillStyle=col;
  const x0=Math.round((x-cam.x)*S), y0=Math.round((y-cam.y)*S);
  ctx.fillRect(x0,y0,Math.max(1,Math.round((x+w-cam.x)*S)-x0),Math.max(1,Math.round((y+h-cam.y)*S)-y0));
}
function fs(base){return Math.max(6,Math.min(base*1.2,Math.round(S*base/4)))}

// ── layout model ────────────────────────────────────────────────────────
// layout = {desks:{agentId:{x,y}}, items:[{id,type,x,y}], rooms:{meet|pantry|rest:{x,y}}}; saved on the office server (/layout).
let layout={desks:{},items:null,rooms:null};   // saved
let edit=null;                                  // working copy while editing
let sel=null, drag=null, pan=null;
const ITEM_SIZE={tvset:{w:26,h:23},plant:{w:7,h:9},shelf:{w:12,h:14}};
const ROOM_SIZE={meet:{w:96,h:52},pantry:{w:48,h:26},rest:{w:48,h:26}};
const ROOM_LABEL={meet:"MEETING",pantry:"PANTRY",rest:"REST ROOM"};
const DESK_W=16, DESK_H=26;                     // desk + label area, used for overlap checks
function worldInfo(){
  const n=Math.max(1,agents.length);
  const cols=Math.max(4,Math.ceil(Math.sqrt(n*1.6))), rows=Math.ceil(n/cols);
  const workW=10+cols*34, workH=14+rows*32+34, wx=workW+6;
  return {n,cols,rows,workW,workH,wx,W:wx+104,H:100};
}
function curL(){return edit||layout}
function deskPos(i,a,wi){
  const o=curL().desks&&curL().desks[a.id];
  return o?{x:o.x,y:o.y}:{x:10+(i%wi.cols)*34,y:14+Math.floor(i/wi.cols)*32};
}
function defaultItems(wi){
  const cx=Math.floor(wi.workW/2), y=14+wi.rows*32+6;
  return [{id:"tv1",type:"tvset",x:cx-13,y},{id:"pl1",type:"plant",x:10,y:y+8},{id:"pl2",type:"plant",x:wi.workW-14,y:y+8}];
}
function itemsOf(wi){return curL().items||defaultItems(wi)}
function defaultRooms(wi){const x=wi.wx;return {meet:{x,y:8},pantry:{x,y:62},rest:{x,y:90}}}
function roomPos(k,wi){const o=curL().rooms&&curL().rooms[k];return o?{x:o.x,y:o.y}:defaultRooms(wi)[k]}
function rooms(wi){
  const R={};
  for(const k of Object.keys(ROOM_SIZE)){const p=roomPos(k,wi),s=ROOM_SIZE[k];R[k]={x:p.x,y:p.y,w:s.w,h:s.h,label:ROOM_LABEL[k]}}
  const m=R.meet; m.table={x:m.x+16,y:m.y+21,w:64,h:10}; m.seats=[];
  for(let i=0;i<4;i++)m.seats.push({x:m.x+20+i*16,y:m.y+8});          // top row
  for(let i=0;i<4;i++)m.seats.push({x:m.x+20+i*16,y:m.y+34});         // bottom row
  const p=R.pantry; p.tc={x:p.x+32,y:p.y+16}; p.coffee={x:p.x+3,y:p.y+8};
  p.seats=[{x:p.tc.x-13,y:p.tc.y-6},{x:p.tc.x+5,y:p.tc.y-6}];
  const r=R.rest;
  r.beds=[{x:r.x+3,y:r.y+6},{x:r.x+27,y:r.y+6},{x:r.x+3,y:r.y+17},{x:r.x+27,y:r.y+17}].map(b=>({x:b.x,y:b.y,sx:b.x+5,sy:b.y-4}));
  return R;
}
// every movable thing as a rectangle (used for overlap checks and world size)
function allRects(wi,except){
  const out=[];
  agents.forEach((a,i)=>{const d=deskPos(i,a,wi);out.push({key:"desk:"+a.id,x:d.x,y:d.y,w:DESK_W,h:DESK_H})});
  for(const it of itemsOf(wi)){const s=ITEM_SIZE[it.type]||{w:8,h:8};out.push({key:"item:"+it.id,x:it.x,y:it.y,w:s.w,h:s.h})}
  for(const k of Object.keys(ROOM_SIZE)){const p=roomPos(k,wi),s=ROOM_SIZE[k];out.push({key:"room:"+k,x:p.x,y:p.y,w:s.w,h:s.h})}
  return except?out.filter(r=>r.key!==except):out;
}
function collides(rects,x,y,w,h){
  for(const r of rects)if(x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y)return true;
  return false;
}
let ANCH=null;
function computeAnchors(){
  const wi=worldInfo(), R=rooms(wi), items=itemsOf(wi), sofas=[];
  for(const it of items)if(it.type==="tvset"){
    sofas.push({x:it.x+3,y:it.y+10,item:it.id,side:0},{x:it.x+15,y:it.y+10,item:it.id,side:1});
  }
  let W=60,H=60;
  for(const r of allRects(wi)){W=Math.max(W,r.x+r.w);H=Math.max(H,r.y+r.h)}
  wi.W=W+6; wi.H=H+6;
  ANCH={wi,R,items,sofas};
}

// ── office scene ────────────────────────────────────────────────────────
function drawFloorAndWall(wi){
  for(let y=0;y<wi.H;y+=8)for(let x=0;x<wi.W;x+=8)
    px(x,y,8,8,((x+y)/8)%2?"#2a2138":"#251d31");
  px(0,0,wi.W,6,"#3a2f4b"); px(0,6,wi.W,1,"#241c30");            // wall
  for(let x=14;x<wi.W-14;x+=26){px(x,1,10,4,"#151022");           // windows
    px(x+1,2,8,2,"#3b5a8f");px(x+2,2,2,1,"#7fa8d8");}
  px(1,1,7,6,"#54381f"); px(2,2,5,5,"#6b4a2f"); px(6,4,1,1,"#e8c170");  // door (agents walk in here)
}
function roomBox(r,tint){
  px(r.x,r.y,r.w,r.h,tint);
  px(r.x,r.y,r.w,1,"#4a3d60"); px(r.x,r.y+r.h-1,r.w,1,"#4a3d60");
  px(r.x,r.y,1,r.h,"#4a3d60"); px(r.x+r.w-1,r.y,1,r.h,"#4a3d60");
  if(S>=2){ctx.font=fs(9)+"px ui-monospace,monospace";ctx.textAlign="left";ctx.fillStyle="#7a6f8f";
    ctx.fillText(r.label,X(r.x+2),Y(r.y+r.h-2))}
}
function drawRooms(R){
  // meeting room: whiteboard + long table
  roomBox(R.meet,"#2c2540");
  const m=R.meet, t=m.table;
  px(m.x+28,m.y+2,40,5,"#c8c8d8"); px(m.x+29,m.y+3,38,3,"#e8e8f0");
  px(t.x,t.y,t.w,t.h,"#6b4a2f"); px(t.x,t.y,t.w,1,"#7d5a3a"); px(t.x+1,t.y+t.h,t.w-2,1,"#54381f");
  px(t.x+6,t.y+3,6,3,"#4a4a5a"); px(t.x+28,t.y+3,6,3,"#4a4a5a"); px(t.x+50,t.y+3,6,3,"#4a4a5a");   // laptops
  // pantry: counter, coffee machine, microwave, sink, fridge, round table
  roomBox(R.pantry,"#2e2a3a");
  const p=R.pantry;
  px(p.x+2,p.y+2,36,5,"#54381f"); px(p.x+2,p.y+2,36,1,"#6b4a2f");
  px(p.x+4,p.y-0,5,4,"#33283f"); px(p.x+5,p.y+1,1,1,"#d84f6f");          // coffee machine on counter
  px(p.x+13,p.y+0,8,4,"#4a4a5a"); px(p.x+14,p.y+1,5,2,"#1a1f2e");       // microwave
  px(p.x+25,p.y+3,6,3,"#7fa8d8"); px(p.x+26,p.y+3,4,1,"#a8c8e8");        // sink
  px(p.x+40,p.y+1,6,14,"#c8c8d8"); px(p.x+40,p.y+8,6,1,"#8a8a9a");       // fridge
  const c=p.tc;
  px(c.x-4,c.y-6,8,12,"#6b4a2f");px(c.x-6,c.y-5,12,10,"#6b4a2f");px(c.x-7,c.y-3,14,6,"#6b4a2f");
  // rest room: beds + bean bag
  roomBox(R.rest,"#2a2538");
  for(const b of R.rest.beds){px(b.x,b.y,18,9,"#4a3d60");px(b.x,b.y-1,18,1,"#6b4a2f");px(b.x+1,b.y+1,5,3,"#e8e0c8")}
  px(R.rest.x+18,R.rest.y+22,6,3,"#9b6fd8");px(R.rest.x+19,R.rest.y+21,4,1,"#b48fe8");
}
function drawBedFronts(R){for(const b of R.rest.beds){px(b.x+1,b.y+3,16,6,"#3b5a8f");px(b.x+1,b.y+3,16,1,"#5a7ab0")}}
function drawItem(it,tvOn){
  const x=it.x,y=it.y;
  if(it.type==="tvset"){
    px(x+5,y,16,9,"#151022");
    const bars=["#3b5a8f","#7fa8d8","#d84f6f","#c9a227","#5fce7a"];
    for(let i=0;i<14;i+=2)px(x+6+i,y+1,2,7,tvOn?bars[(i/2+(frame>>4))%bars.length]:"#0d0a14");
    px(x+10,y+9,6,1,"#4a4a5a");
    px(x+1,y+14,24,4,"#6b3a5a");                                 // sofa back
  }else if(it.type==="plant"){
    px(x+1,y,3,1,"#5fce7a");px(x,y+1,2,2,"#5fce7a");px(x+4,y+1,2,2,"#4aa860");
    px(x+1,y+3,2,3,"#8d5524");px(x+1,y+6,3,1,"#54381f");
  }else if(it.type==="shelf"){
    px(x,y,12,14,"#54381f");px(x+1,y+1,10,12,"#3c2814");
    for(let r=0;r<3;r++){px(x+1,y+4+r*4,10,1,"#6b4a2f");
      px(x+2,y+1+r*4,2,3,["#d84f6f","#4fa4d8","#c9a227"][r]);px(x+5,y+1+r*4,2,3,"#5fce7a");px(x+8,y+1+r*4,2,3,"#9b6fd8")}
  }
}
function drawItemFront(it){
  if(it.type!=="tvset")return;
  const x=it.x,y=it.y;
  px(x+1,y+18,24,4,"#8a4a74");                                   // seat cushion (hides legs)
  px(x,y+15,2,8,"#5a2f4a"); px(x+24,y+15,2,8,"#5a2f4a");        // arms
  px(x+1,y+22,24,1,"#3c2814");
}
function drawDesk(x,y){
  px(x,y+10,16,1,"#6b4a2f"); px(x,y+11,16,3,"#54381f");
  px(x+1,y+14,2,4,"#3c2814"); px(x+13,y+14,2,4,"#3c2814");
  px(x+10,y+4,6,5,"#191524");
  px(x+12,y+9,2,1,"#4a4a5a");
}
function deskScreen(x,y,a){
  const t=frame>>3;
  let col="#0f2c1e";
  if(a){
    if(a.activity==="running")col=(t%4<2)?"#0f3c1e":"#0f2c16";
    else if(a.activity==="browsing")col=(t%6<3)?"#1e2c4a":"#24365a";
    else if(a.activity==="typing")col=(t%2)?"#12321e":"#0f2c1e";
    else if(a.status==="waiting")col="#3c1e28";
  }
  px(x+11,y+5,4,3,col);
}

// ── characters ──────────────────────────────────────────────────────────
function drawChar(a,fx,fy,seatedOrPose){
  const pose = typeof seatedOrPose==="string" ? seatedOrPose : (seatedOrPose?"seated":"walk");
  const seated = pose==="seated";
  const h=hash(a.id), skin=SKIN[h%SKIN.length], shirt=SHIRT[(h>>3)%SHIRT.length],
        hair=HAIR[(h>>6)%HAIR.length], t=frame>>4;
  const walking = pose==="walk";
  const bob=((a.status==="working"||walking)&&(t%2))?1:0;
  const x=fx, y=fy+bob;
  if(a.status==="gone")ctx.globalAlpha=0.35;
  px(x+2,y,4,3,hair);
  if(h%3===0)px(x+1,y+1,1,2,hair);
  if(h%5===0)px(x+2,y-1,4,1,hair);
  px(x+2,y+2,4,3,skin);
  if(pose==="sleep"){px(x+2,y+3,2,1,"#5a4030");px(x+4,y+3,2,1,"#5a4030")}
  else if(h%4===0){px(x+2,y+3,2,1,"#222a44");px(x+4,y+3,2,1,"#222a44")}
  else{px(x+3,y+3,1,1,"#111");px(x+5,y+3,1,1,"#111")}
  px(x+1,y+5,6,5,shirt);
  if(a.kind==="subagent")px(x+1,y+5,6,1,"#e8c170");
  px(x+0,y+6,1,3,skin); px(x+7,y+6,1,3,skin);
  if(walking){
    if(t%2){px(x+2,y+10,1,3,"#2d2d3d");px(x+5,y+11,1,2,"#2d2d3d")}
    else{px(x+2,y+11,1,2,"#2d2d3d");px(x+5,y+10,1,3,"#2d2d3d")}
  }else{
    px(x+2,y+10,1,3,"#2d2d3d"); px(x+5,y+10,1,3,"#2d2d3d");
  }
  if(seated){
    if(a.activity==="typing"&&(frame>>2)%2)px(x+7,y+8,2,1,skin);
    else if(a.activity==="running"&&t%2)px(x+7,y+8,2,1,skin);
    else if(a.activity==="reading"){px(x+7,y+7,3,2,"#e8e0c8");px(x+8,y+7,1,2,"#b8b0a0")}
    else if(a.activity==="delegating"&&t%2)px(x+8,y+6,2,1,skin);
  }
  if(pose==="cup"){px(x+7,y+7,2,2,"#e8e0c8");
    if((frame>>4)%2)px(x+8,y+5,1,1,"#cfc4e8");else px(x+7,y+5,1,1,"#cfc4e8");}
  if(pose==="sleep"&&S>=1.5){ctx.fillStyle="#cfc4e8";ctx.font="bold "+fs(11)+"px ui-monospace,monospace";
    ctx.textAlign="left";const zy=(frame>>5)%3;
    ctx.fillText("z",X(x+8),Y(y-1-zy));ctx.fillText("Z",X(x+10),Y(y-4-zy));}
  ctx.globalAlpha=1;
}
function drawChat(c){
  const x=c.x,y=c.y,n=((frame>>4)%3)+1;
  px(x+1,y-7,8,5,"#e8d8b0"); px(x+3,y-2,1,1,"#e8d8b0");
  for(let i=0;i<3;i++)px(x+2+i*2,y-5,1,1,i<n?"#3a2f4b":"#c8b890");
}
function drawBubble(a,x,y){
  const t=frame>>4;
  if(a.status==="waiting"){
    const by=y-6-((frame>>3)%2);
    px(x+1,by,6,4,"#e8d8b0"); px(x+2,by+4,1,1,"#e8d8b0");
    px(x+4,by+1,1,2,"#c9302f"); px(x+4,by+3,1,1,"#c9302f");
  }else if(a.status==="working"&&a.tool){
    px(x+3,y-4,3,3,"#e8c170"); px(x+4,y-3,1,1,"#1a1423");
  }else if(a.status==="thinking"){
    for(let i=0;i<3;i++)px(x+2+i*2,y-3,1,1,i<=(t%4)?"#cfc4e8":"#4a4060");
  }else if(a.status==="done"){
    px(x+2,y-4,1,1,"#5fce7a");px(x+3,y-3,1,1,"#5fce7a");
    px(x+4,y-4,1,1,"#5fce7a");px(x+5,y-5,1,1,"#5fce7a");
  }else if(a.status==="idle"&&(t%8)<4){
    px(x+6,y-4,1,1,"#7a6f8f");px(x+7,y-5,1,1,"#7a6f8f");
  }
}
function label(a,x,y){
  if(S<1.6)return;                                       // zoomed far out: no text
  const cx=X(x+8); ctx.textAlign="center";
  ctx.font=fs(10)+"px ui-monospace,monospace";
  ctx.fillStyle=a.kind==="subagent"?"#e8c170":"#cfc4e8";
  ctx.fillText(a.label.slice(0,17),cx,Y(y+18.5));
  if(S<2.6)return;
  let dy=0;
  if(a.model){
    ctx.font=fs(9)+"px ui-monospace,monospace";ctx.fillStyle="#8a7fb0";
    ctx.fillText((a.model.replace(/^claude-/,"")+" \u00b7 "+(a.effort||"?")).slice(0,22),cx,Y(y+21.5));
    ctx.font=fs(10)+"px ui-monospace,monospace";dy=3;
  }
  const st=a.status==="waiting"?"needs input!":a.status==="working"?(a.tool||"working"):a.status;
  ctx.fillStyle={working:"#5fce7a",thinking:"#c9a227",idle:"#7a6f8f",waiting:"#d84f6f",done:"#5fce7a",gone:"#555"}[a.status]||"#7a6f8f";
  ctx.fillText(st.slice(0,17),cx,Y(y+21.5+dy));
  if(a.detail&&S>=3){ctx.fillStyle="#6a5f80";ctx.fillText(a.detail.slice(0,19),cx,Y(y+24.5+dy))}
}

// ── seats + walking + idle life ─────────────────────────────────────────
const chars = new Map();
const WALK = 0.55;
function poseOf(c){
  if(c.phase!=="seated")return "walk";
  if(c.moving)return "walk";
  const k=c.act&&c.act.state==="stay"?c.act.type:"";
  return {coffee:"cup",tv:"sit",chat:"stand",meet:"stand",listen:"seated",wander:"stand",rest:"sleep",sleep:"sleep"}[k]||"seated";
}
function usedBy(type,key){const s=new Set();for(const o of chars.values())if(o.act&&o.act.type===type&&o.act[key]!=null)s.add(o.act[key]);return s}
function startIdleAct(c,a){
  const A=ANCH, idleFor=frame-c.idleSince, r=Math.random();
  if(idleFor>1800&&r<0.4){                                // rest room bed
    const used=usedBy("rest","bed"), free=A.R.rest.beds.map((b,k)=>k).filter(k=>!used.has(k));
    if(free.length){const k=free[rnd(0,free.length-1)],b=A.R.rest.beds[k];
      c.act={type:"rest",state:"go",bed:k,tx:b.sx,ty:b.sy,dur:rnd(1800,3600)};return;}
    c.act={type:"sleep",state:"stay",until:frame+rnd(1500,3000)};return;     // rest room full: sleep at the desk
  }
  const r2=Math.random();
  if(r2<0.22){                                            // pantry: coffee at the machine or the round table
    const spots=[A.R.pantry.coffee,...A.R.pantry.seats], u=usedBy("coffee","spot");
    const free=spots.map((s,k)=>k).filter(k=>!u.has(k));
    if(free.length){const k=free[rnd(0,free.length-1)];
      c.act={type:"coffee",state:"go",spot:k,tx:spots[k].x,ty:spots[k].y,dur:rnd(300,600)};return;}
  }
  if(r2<0.42&&A.sofas.length){                            // TV + sofa
    const used=new Set([...chars.values()].filter(o=>o.act&&o.act.type==="tv").map(o=>o.act.item+":"+o.act.side));
    const free=A.sofas.filter(s=>!used.has(s.item+":"+s.side));
    if(free.length){const s=free[rnd(0,free.length-1)];
      c.act={type:"tv",state:"go",item:s.item,side:s.side,tx:s.x,ty:s.y,dur:rnd(900,1500)};return;}
  }
  const idlePeers=()=>agents.map(o=>({o,oc:chars.get(o.id)})).filter(e=>e.o.id!==a.id&&e.o.kind==="main"&&
      e.o.status==="idle"&&e.oc&&e.oc.phase==="seated"&&!e.oc.act&&!e.oc.moving);
  if(r2<0.62){                                            // meeting room: 2-4 agents gather at the long table
    const peers=idlePeers(), u=usedBy("meet","seat"), free=A.R.meet.seats.map((s,k)=>k).filter(k=>!u.has(k));
    if(peers.length&&free.length>=2){
      const n=Math.min(peers.length,rnd(1,3),free.length-1), dur=rnd(500,900);
      const grp=[...peers].sort(()=>Math.random()-0.5).slice(0,n).map(e=>e.oc);
      const st=rnd(0,free.length-1), order=free.slice(st).concat(free.slice(0,st));
      [c,...grp].forEach((m,j)=>{const k=order[j],s=A.R.meet.seats[k];
        m.act={type:"meet",state:"go",seat:k,tx:s.x,ty:s.y,dur}});
      return;
    }
  }
  if(r2<0.76){                                            // walk over to a colleague's desk
    const peers=idlePeers();
    if(peers.length){
      const e=peers[rnd(0,peers.length-1)], dur=rnd(400,700);
      const tx=e.oc.seat.x+2+(e.oc.seat.x>c.seat.x?-9:9), ty=e.oc.seat.y;
      const dist=Math.hypot(tx-c.x,ty-c.y)/WALK+30;
      c.act={type:"chat",state:"go",tx,ty,dur};
      e.oc.act={type:"listen",state:"stay",until:frame+dist+dur};
      return;
    }
  }
  const wi=A.wi, pts=[{x:rnd(14,Math.max(16,wi.workW-24)),y:wi.workH-rnd(20,30)}];
  for(const it of A.items)if(it.type==="plant"||it.type==="shelf")pts.push({x:it.x-6,y:it.y+2});
  const pt=pts[rnd(0,pts.length-1)];
  c.act={type:"wander",state:"go",tx:pt.x,ty:pt.y,dur:rnd(150,350)};
}
function stepChars(){
  const seen=new Set(), wi=ANCH.wi;
  agents.forEach((a,i)=>{
    seen.add(a.id);
    const seat=deskPos(i,a,wi);
    let c=chars.get(a.id);
    if(!c){ c={x:2,y:2,seat,phase:"in",lastStatus:a.status,act:null,idleSince:0,nextAt:frame+rnd(200,600),moving:true};
      chars.set(a.id,c); }
    c.seat=seat;
    if(a.status!=="idle"||a.kind!=="main"){
      if(c.act&&c.act.type!=="return")c.act={type:"return"};
      c.idleSince=0; c.nextAt=frame+300;
    }else if(c.phase==="seated"){
      if(!c.idleSince)c.idleSince=frame;
      if(!c.act&&frame>=c.nextAt&&!edit)startIdleAct(c,a);
    }
    if(c.act&&c.act.state==="stay"&&frame>c.act.until){
      if(c.act.type==="listen"){c.act=null;c.nextAt=frame+rnd(300,900);}
      else c.act={type:"return"};
    }
    let tx=c.seat.x+2, ty=c.seat.y;
    if(c.phase==="out"){tx=2;ty=2}
    else if(c.act&&c.act.tx!=null&&c.act.type!=="return"){tx=c.act.tx;ty=c.act.ty}
    const dx=tx-c.x, dy=ty-c.y, d=Math.hypot(dx,dy);
    if(d<WALK){
      c.x=tx;c.y=ty;c.moving=false;
      if(c.phase==="in")c.phase="seated";
      if(c.act){
        if(c.act.type==="return"){c.act=null;c.nextAt=frame+rnd(300,900);}
        else if(c.act.state==="go"){c.act.state="stay";c.act.until=frame+c.act.dur;}
      }
    }else{ c.x+=dx/d*WALK; c.y+=dy/d*WALK; c.moving=true; }
    if(c.lastStatus!==a.status){
      if(a.status==="waiting")chime([880,660,880]);
      else if(a.status==="done"&&a.kind==="subagent")chime([520,780]);
      c.lastStatus=a.status;
    }
  });
  for(const [id,c] of chars){
    if(!seen.has(id)){
      c.phase="out"; c.moving=true;
      const dx=2-c.x, dy=2-c.y, d=Math.hypot(dx,dy);
      if(d<WALK)chars.delete(id);
      else{c.x+=dx/d*WALK;c.y+=dy/d*WALK;}
    }
  }
}

// ── sound (off by default; toggle persists) ─────────────────────────────
let soundOn=false, audioCtx=null;
try{soundOn=localStorage.getItem("pixelOfficeSound")==="1"}catch(e){}
function chime(notes){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="square";o.frequency.value=f;
      g.gain.setValueAtTime(0.06,audioCtx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.12+0.11);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+i*0.12);o.stop(audioCtx.currentTime+i*0.12+0.12);
    });
  }catch(e){}
}
const sBtn=document.getElementById("sound");
function syncSoundBtn(){sBtn.textContent=soundOn?"\u266a sound on":"\u266a sound off";sBtn.classList.toggle("on",soundOn)}
sBtn.onclick=()=>{soundOn=!soundOn;
  try{localStorage.setItem("pixelOfficeSound",soundOn?"1":"0")}catch(e){}
  if(soundOn)chime([660]); syncSoundBtn()};
syncSoundBtn();
const spawnBtn=document.getElementById("spawn");
if(IN_VSCODE){spawnBtn.style.display="";spawnBtn.onclick=()=>vsapi.postMessage({type:"spawnAgent"});}

// ── camera: scroll, zoom, fit ───────────────────────────────────────────
function fitCam(){
  const wi=ANCH.wi, W=cv.clientWidth, H=cv.clientHeight;
  cam.z=Math.max(0.8,Math.min(5,Math.min(W/wi.W,H/wi.H)));
  cam.x=(wi.W-W/cam.z)/2; cam.y=(wi.H-H/cam.z)/2;
}
function zoomAt(mx,my,f){
  const wx=cam.x+mx/cam.z, wy=cam.y+my/cam.z;
  cam.z=Math.max(0.8,Math.min(8,cam.z*f)); cam.x=wx-mx/cam.z; cam.y=wy-my/cam.z; userCam=true;
}
cv.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  if(ev.ctrlKey||ev.metaKey)zoomAt(mx,my,Math.pow(1.0015,-ev.deltaY));
  else{ if(ev.shiftKey)cam.x+=ev.deltaY/cam.z; else{cam.y+=ev.deltaY/cam.z;cam.x+=ev.deltaX/cam.z} userCam=true; }
},{passive:false});
document.getElementById("zin").onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.25);
document.getElementById("zout").onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,0.8);
document.getElementById("fit").onclick=()=>{userCam=false};
document.getElementById("full").onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
  userCam=false;
};
document.addEventListener("fullscreenchange",()=>{document.body.classList.toggle("fs",!!document.fullscreenElement);userCam=false});
window.addEventListener("keydown",ev=>{
  if(ev.key==="Delete"||ev.key==="Backspace"){if(edit&&sel)removeSel()}
  const st=20/cam.z; let m=true;
  if(ev.key==="ArrowLeft")cam.x-=st;else if(ev.key==="ArrowRight")cam.x+=st;
  else if(ev.key==="ArrowUp")cam.y-=st;else if(ev.key==="ArrowDown")cam.y+=st;else m=false;
  if(m)userCam=true;
});

// ── layout editing (drag desks, furniture and rooms; no overlaps; saved on the server) ──
const editBtn=document.getElementById("edit"), editBar=document.getElementById("editbar");
if(IN_VSCODE)editBtn.style.display="none";
function snap(v){return Math.round(v/2)*2}
function toWorld(ev){const r=cv.getBoundingClientRect();return {x:cam.x+(ev.clientX-r.left)/cam.z,y:cam.y+(ev.clientY-r.top)/cam.z}}
function setEditUI(on){editBar.style.display=on?"flex":"none";editBtn.style.display=on?"none":(IN_VSCODE?"none":"");cv.style.cursor=on?"default":"grab"}
function resetActs(){for(const c of chars.values())if(c.act)c.act={type:"return"}}
function startEdit(){
  const wi=ANCH.wi, L={desks:{},items:itemsOf(wi).map(o=>({...o})),rooms:{}};
  agents.forEach((a,i)=>{L.desks[a.id]=deskPos(i,a,wi)});
  for(const k of Object.keys(ROOM_SIZE)){const p=roomPos(k,wi);L.rooms[k]={x:p.x,y:p.y}}
  edit=L; sel=null; userCam=true; resetActs(); setEditUI(true);
}
function refOf(key){
  if(key.startsWith("item:"))return edit.items.find(o=>"item:"+o.id===key);
  if(key.startsWith("desk:"))return edit.desks[key.slice(5)];
  return edit.rooms[key.slice(5)];
}
function hitTest(w){
  const pr=r=>r.key.startsWith("item:")?0:r.key.startsWith("desk:")?1:2;
  const hits=allRects(ANCH.wi).filter(r=>w.x>=r.x&&w.x<=r.x+r.w&&w.y>=r.y&&w.y<=r.y+r.h).sort((a,b)=>pr(a)-pr(b));
  if(!hits.length)return null;
  const r=hits[0]; return {key:r.key,ref:refOf(r.key),w:r.w,h:r.h};
}
function removeSel(){if(!edit||!sel||!sel.startsWith("item:"))return;edit.items=edit.items.filter(o=>"item:"+o.id!==sel);sel=null}
function addItem(type){
  if(!edit)return;
  const sz=ITEM_SIZE[type], rects=allRects(ANCH.wi);
  const cx=snap(cam.x+cv.clientWidth/2/cam.z-sz.w/2), cy=snap(cam.y+cv.clientHeight/2/cam.z-sz.h/2);
  for(let r=0;r<=200;r+=2)for(let dx=-r;dx<=r;dx+=2)for(let dy=-r;dy<=r;dy+=2){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const x=cx+dx,y=cy+dy; if(x<0||y<8)continue;
    if(!collides(rects,x,y,sz.w,sz.h)){
      const it={id:"n"+Date.now()+rnd(0,99),type,x,y}; edit.items.push(it); sel="item:"+it.id; return;
    }
  }
  document.getElementById("count").textContent="no free space for that item";
}
cv.addEventListener("mousedown",ev=>{
  const w=toWorld(ev);
  if(edit){
    const h=hitTest(w);
    if(h){sel=h.key;drag={ref:h.ref,key:h.key,w:h.w,h:h.h,ox:w.x-h.ref.x,oy:w.y-h.ref.y};return}
    sel=null;
  }
  pan={mx:ev.clientX,my:ev.clientY,cx:cam.x,cy:cam.y};
});
window.addEventListener("mousemove",ev=>{
  if(drag){
    const w=toWorld(ev), nx=Math.max(0,snap(w.x-drag.ox)), ny=Math.max(8,snap(w.y-drag.oy));
    const rects=allRects(ANCH.wi,drag.key), ref=drag.ref;
    if(!collides(rects,nx,ny,drag.w,drag.h)){ref.x=nx;ref.y=ny}              // free spot
    else if(!collides(rects,nx,ref.y,drag.w,drag.h))ref.x=nx;                // slide along x
    else if(!collides(rects,ref.x,ny,drag.w,drag.h))ref.y=ny;                // slide along y
  }
  else if(pan){cam.x=pan.cx-(ev.clientX-pan.mx)/cam.z;cam.y=pan.cy-(ev.clientY-pan.my)/cam.z;userCam=true}
});
window.addEventListener("mouseup",()=>{drag=null;pan=null});
editBtn.onclick=()=>{if(!edit)startEdit()};
document.getElementById("addplant").onclick=()=>addItem("plant");
document.getElementById("addtv").onclick=()=>addItem("tvset");
document.getElementById("addshelf").onclick=()=>addItem("shelf");
document.getElementById("del").onclick=removeSel;
document.getElementById("cancel").onclick=()=>{edit=null;sel=null;setEditUI(false);userCam=false;resetActs()};
document.getElementById("reset").onclick=()=>{
  if(!edit)return;
  const wi=ANCH.wi; edit.desks={}; edit.items=defaultItems(wi); sel=null;
  edit.rooms={}; for(const [k,v] of Object.entries(defaultRooms(wi)))edit.rooms[k]={...v};
  agents.forEach((a,i)=>{edit.desks[a.id]={x:10+(i%wi.cols)*34,y:14+Math.floor(i/wi.cols)*32}});
};
document.getElementById("save").onclick=async()=>{
  if(!edit)return;
  try{
    const r=await fetch("layout",{method:"POST",headers:{"Content-Type":"application/json","X-PixelOffice":"1"},body:JSON.stringify(edit)});
    if(!r.ok)throw new Error("save failed "+r.status);
    layout=edit; edit=null; sel=null; setEditUI(false); userCam=false; resetActs();
  }catch(e){document.getElementById("count").textContent="save failed: "+e.message}
};
async function loadLayout(){
  try{const r=await fetch("layout");const d=await r.json();
    if(d&&typeof d==="object"&&(d.desks||d.items||d.rooms))layout={desks:d.desks||{},items:d.items||null,rooms:d.rooms||null};}catch(e){}
}

// ── render loop ─────────────────────────────────────────────────────────
function render(){
  frame++;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  computeAnchors();
  if(!userCam)fitCam();
  S=cam.z;
  const A=ANCH, wi=A.wi;
  ctx.fillStyle="#1a1423";ctx.fillRect(0,0,W,H);
  drawFloorAndWall(wi);
  drawRooms(A.R);
  stepChars();
  const tvOn=new Set();
  for(const c of chars.values())if(c.act&&c.act.type==="tv"&&c.act.state==="stay")tvOn.add(c.act.item);
  for(const it of A.items)drawItem(it,tvOn.has(it.id));
  agents.forEach((a,i)=>{const s=deskPos(i,a,wi);drawDesk(s.x,s.y);deskScreen(s.x,s.y,a)});
  agents.forEach(a=>{
    const c=chars.get(a.id); if(!c)return;
    drawChar(a,c.x,c.y,poseOf(c));
    if(c.act&&c.act.state==="stay"&&(c.act.type==="chat"||c.act.type==="listen"||c.act.type==="meet"))drawChat(c);
  });
  for(const it of A.items)drawItemFront(it);
  drawBedFronts(A.R);
  agents.forEach((a,i)=>{
    const c=chars.get(a.id); if(!c||c.phase==="out")return;
    const seat=deskPos(i,a,wi);
    const home=c.phase==="seated"&&!c.moving&&!c.act;
    if(home)drawBubble(a,seat.x+2,seat.y);
    if(c.phase==="seated")label(a,seat.x,seat.y);
    if(!home&&S>=2.2){ctx.font=fs(8)+"px ui-monospace,monospace";ctx.textAlign="center";ctx.fillStyle="#b8aed8";
      ctx.fillText(a.label.slice(0,12),X(c.x+4),Y(c.y-9))}          // name tag while away from the desk
  });
  for(const [id,c] of chars){
    if(c.phase==="out"&&!agents.find(a=>a.id===id))
      drawChar({id,kind:"main",status:"gone",activity:""},c.x,c.y,"walk");
  }
  if(edit){                                                // edit overlay: outlines + selection
    const box=(x,y,w,h,col)=>{px(x,y,w,0.5,col);px(x,y+h,w,0.5,col);px(x,y,0.5,h,col);px(x+w,y,0.5,h,col)};
    for(const r of allRects(wi)){
      const col=sel===r.key?"#e8c170":r.key.startsWith("room:")?"#d8884f":r.key.startsWith("item:")?"#5fce7a":"#4fa4d8";
      box(r.x-1,r.y-1,r.w+2,r.h+2,col);
    }
    ctx.font="12px ui-monospace";ctx.textAlign="center";ctx.fillStyle="#e8c170";
    ctx.fillText("EDIT: drag desks, furniture and rooms (no overlap). Delete removes furniture. Then save.",W/2,H-10);
  }
  ctx.font="13px ui-monospace";ctx.textAlign="center";
  if(offline){
    ctx.fillStyle="#d84f6f";
    ctx.fillText("hermes office unreachable \u2014 "+offline,W/2,H/2);
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("enable with: hermes plugins enable pixel-office, then run a session",W/2,H/2+20);
  }else if(!agents.length){
    ctx.fillStyle="#7a6f8f";
    ctx.fillText("office is empty \u2014 run something in Hermes \u2624",W/2,H/2);
  }
  requestAnimationFrame(render);
}

// ── data feed: postMessage (VS Code) or poll /state (browser) ───────────
function applyState(state){
  offline=null; agents=(state&&state.agents)||[];
  const n=agents.length, w=agents.filter(a=>a.status==="waiting").length;
  document.getElementById("count").textContent=
    n+" agent"+(n===1?"":"s")+(w?" \u00b7 "+w+" waiting!":"");
}
if(IN_VSCODE){
  window.addEventListener("message",(ev)=>{
    const m=ev.data||{};
    if(m.type==="state")applyState(m.state);
    else if(m.type==="offline"){offline=m.url;agents=[];
      document.getElementById("count").textContent="offline";}
  });
}else{
  loadLayout();
  (async function poll(){
    try{const r=await fetch("state");applyState(await r.json());}
    catch(e){offline=String(location.host);agents=[];
      document.getElementById("count").textContent="offline";}
    setTimeout(poll,1500);
  })();
}
render();
</script>
